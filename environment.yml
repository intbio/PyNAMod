name: pynamod

channels:
  - conda-forge
  - pip

dependencies:
  - python=3.13
  - pip
  - ipykernel
  - biopython
  - mdanalysis
  - pypdb
  - numba
  - nglview=3.1.4
  - setuptools<80
  - seaborn
  - more-itertools
  - pytest
  - ipywidgets
  - onnxruntime
  - networkx<3.6.1

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - --find-links https://data.pyg.org/whl/torch-2.9.0+cu130.html
      - torch==2.9.*
      - pdb2pqr
